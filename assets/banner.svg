<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Jay Pratap Singh Bhadoria — Frontend Developer</title>
  <desc id="desc">A clean dark header with profile photo, name, role and availability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1524"/>
      <stop offset="1" stop-color="#121b2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.45"/>
    </pattern>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(1600px); } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      .shimmer { animation: sweep 7s linear infinite; }
      .status { animation: pulse 2.2s ease-in-out infinite; }
      .arcs { transform-box: fill-box; transform-origin: center; animation: orbit 45s linear infinite; }
    </style>
    <clipPath id="avatarClip">
      <circle cx="116" cy="130" r="74"/>
    </clipPath>
  </defs>

  <rect width="1200" height="260" rx="12" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="12" fill="url(#dots)"/>
  <rect x="-400" y="0" width="320" height="260" fill="url(#shimmer)" class="shimmer"/>
  <rect x="0" y="0" width="5" height="260" fill="url(#accent)"/>

  <g class="arcs" fill="none" stroke="#38bdf8">
    <circle cx="1055" cy="130" r="58" stroke-opacity="0.16"/>
    <circle cx="1055" cy="130" r="88" stroke-opacity="0.11"/>
    <circle cx="1055" cy="130" r="118" stroke-opacity="0.07"/>
  </g>

  <circle cx="116" cy="130" r="78" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.75"/>
  <image x="42" y="56" width="148" height="148" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice" href="data:image/jpeg;base64," xlink:href="data:image/jpeg;base64,"/>

  <g font-family="'Segoe UI',Ubuntu,Arial,sans-serif">
    <text x="225" y="108" font-size="40" font-weight="700" letter-spacing="0.4" fill="#f1f5f9">Jay Pratap Singh Bhadoria</text>
    <text x="225" y="148" font-size="17" fill="#94a3b8">Frontend Developer <tspan fill="#475569">·</tspan> React <tspan fill="#475569">·</tspan> Tailwind CSS <tspan fill="#475569">·</tspan> JavaScript</text>
    <rect x="225" y="174" width="238" height="34" rx="17" fill="#102330" stroke="#1e4a5a"/>
    <circle cx="246" cy="191" r="5" fill="#34d399" class="status"/>
    <text x="262" y="196" font-size="13" letter-spacing="0.3" fill="#a7f3d0">Open to collaborations</text>
  </g>

  <rect x="225" y="248" width="911" height="1" fill="url(#accent)" opacity="0.5"/>
</svg>
