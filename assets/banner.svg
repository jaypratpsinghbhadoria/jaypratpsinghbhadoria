<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Jay Pratap Singh Bhadoria — Frontend Developer</title>
  <desc id="desc">A restrained dark header with the name, role and availability of Jay Pratap Singh Bhadoria.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1524"/>
      <stop offset="1" stop-color="#121b2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="250" rx="12" fill="url(#bg)"/>
  <rect width="1200" height="250" rx="12" fill="url(#dots)"/>
  <rect x="0" y="0" width="5" height="250" fill="url(#accent)"/>

  <g fill="none" stroke="#38bdf8">
    <circle cx="1052" cy="125" r="58" stroke-opacity="0.16"/>
    <circle cx="1052" cy="125" r="88" stroke-opacity="0.11"/>
    <circle cx="1052" cy="125" r="118" stroke-opacity="0.07"/>
    <path d="M934 125h236M1052 7v236" stroke-opacity="0.06"/>
  </g>

  <g font-family="'Segoe UI',Ubuntu,Arial,sans-serif">
    <text x="64" y="112" font-size="44" font-weight="700" letter-spacing="0.5" fill="#f1f5f9">Jay Pratap Singh Bhadoria</text>
    <text x="64" y="152" font-size="18" fill="#94a3b8">Frontend Developer <tspan fill="#475569">·</tspan> React <tspan fill="#475569">·</tspan> Tailwind CSS <tspan fill="#475569">·</tspan> JavaScript</text>
    <rect x="64" y="180" width="238" height="36" rx="18" fill="#102330" stroke="#1e4a5a"/>
    <circle cx="86" cy="198" r="5" fill="#34d399"/>
    <text x="102" y="203" font-size="13" letter-spacing="0.4" fill="#a7f3d0">Open to collaborations</text>
  </g>

  <rect x="64" y="238" width="1072" height="1" fill="url(#accent)" opacity="0.55"/>
</svg>
