<svg xmlns="http://www.w3.org/2000/svg" width="900" height="24" viewBox="0 0 900 24" role="img" aria-label="Animated divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateX(900px); opacity: 0; } }
      .travel { animation: travel 6s ease-in-out infinite; }
    </style>
  </defs>
  <rect x="0" y="11" width="900" height="2" rx="1" fill="url(#line)"/>
  <circle cx="0" cy="12" r="3" fill="#38bdf8" class="travel"/>
</svg>
